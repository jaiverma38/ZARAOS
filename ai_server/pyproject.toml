[project]
name = "zaraos-ai-server"
version = "0.1.0"
description = "ZaraOS AI server for speech, vision, memory, and robot integrations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "opencv-python>=4.9",
]

[project.optional-dependencies]
ai = [
  "transformers>=4.43",
  "torch>=2.3",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "openai-whisper>=20231117",
  "piper-tts>=1.2",
  "ultralytics>=8.2",
  "paddleocr>=2.7",
  "insightface>=0.7",
]
test = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
